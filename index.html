<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKS PRAJU | Guild Glory</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b14;
  color:white;
  text-align:center;
}
header{
  padding:25px 10px;
  background:#111827;
  border-bottom:2px solid #f5c542;
}
h1{color:#f5c542;margin:5px}
.tag{color:#cbd5e1}
.card{
  max-width:420px;
  margin:35px auto;
  padding:25px;
  background:#141c2c;
  border:1px solid #f5c542;
  border-radius:18px;
}
input{
  width:100%;
  padding:14px;
  margin:15px 0;
  border-radius:8px;
  border:1px solid #64748b;
  background:#080b14;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#f5c542;
  color:#111827;
  font-weight:bold;
  font-size:16px;
}
#result{margin-top:20px;line-height:1.6}
.note{color:#cbd5e1;font-size:13px;line-height:1.6}
footer{padding:20px;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>👑 PKS PRAJU</h1>
  <div class="tag">GUILD GLORY TRACKER</div>
</header>

<div class="card">
  <h2>Guild Dashboard</h2>
  <p>Enter your Free Fire Guild ID</p>

  <input id="guildId" type="text"
  placeholder="Enter Guild ID">

  <button onclick="trackGuild()">CHECK GUILD ID</button>

  <div id="result"></div>

  <p class="note">
    Fan-made demo website. This page does not connect
    to Free Fire servers or change Guild Glory.
  </p>
</div>

<footer>
  PKS PRAJU • Fan-made demo • Not affiliated with Garena
</footer>

<script>
function trackGuild(){
  const id=document.getElementById("guildId").value.trim();
  const result=document.getElementById("result");

  if(!id){
    result.textContent="Please enter a Guild ID.";
    return;
  }

  result.textContent="Demo only: Guild ID "+id+
  " entered successfully. Live game data is not connected.";
}
</script>
</body>
</html>
